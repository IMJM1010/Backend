# 테스트 전용 설정 - CI 및 로컬 테스트에서 인메모리 H2 를 사용한다.
# 실제 DB 접속 정보는 application-local.properties (gitignore 대상) 에 둔다.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.jpa.defer-datasource-initialization=true

# ---------- JWT ----------
# 테스트 전용 더미 시크릿. HS256 은 최소 32바이트가 필요하다.
jwt.secret=test-only-secret-key-must-be-at-least-32-bytes-long-0123456789
