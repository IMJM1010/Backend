spring.application.name=BE

# 기본 프로파일. DB 접속 정보 등 개인 설정은 application-local.properties 에 둔다.
# (이 파일은 .gitignore 대상이므로 각자 로컬에서 만들어야 한다. README 참고)
# 운영 배포 시에는 환경변수 SPRING_PROFILES_ACTIVE 로 덮어쓴다.
spring.profiles.active=local

# ---------- 서버 ----------
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ---------- JPA ----------
# OSIV 비활성화: 영속성 컨텍스트를 트랜잭션 범위로 제한해 커넥션을 오래 잡지 않도록 한다.
# 대신 지연 로딩은 반드시 Service 안에서 끝내야 한다. (Controller 에서 프록시 접근 시 예외)
spring.jpa.open-in-view=false
# N+1 완화. 컬렉션/프록시를 IN 절로 묶어서 조회한다.
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# ---------- Jackson ----------
spring.jackson.time-zone=Asia/Seoul
# 참고: Spring Boot 4 는 Jackson 3(tools.jackson.*) 를 사용한다.
# Jackson 3 부터 java.time 값이 기본적으로 ISO-8601 문자열로 직렬화되므로
# Boot 3 시절에 쓰던 spring.jackson.serialization.write-dates-as-timestamps 는
# 더 이상 존재하지 않는다. (설정하면 기동 실패)

# ---------- 페이징 ----------
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.default-produces-media-type=application/json

# ---------- CORS ----------
# 프론트 개발 서버 주소. 배포 주소가 생기면 운영 프로파일에서 덮어쓴다.
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ---------- 로깅 ----------
logging.level.com.example.be=DEBUG
